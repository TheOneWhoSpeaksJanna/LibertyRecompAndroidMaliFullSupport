name: Android repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata-and-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tracked paths and dependency metadata
        run: python tools/setup_repo.py --check-metadata
      - name: Exercise setup and recovery with local test remotes
        run: python tools/test_setup_repo.py
